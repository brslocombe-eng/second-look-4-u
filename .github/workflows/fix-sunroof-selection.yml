name: Fix sunroof selection persistence

on:
  push:
    paths:
      - '.github/workflows/fix-sunroof-selection.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "if(pan&&last.pan)pan.value=last.pan;if(sun&&last.sun)sun.value=last.sun;"
          new = "if(pan&&last.pan)pan.value=last.pan;if(sun&&last.sun)sun.value=last.sun;if(pan&&!pan.dataset.p){pan.dataset.p='1';pan.addEventListener('change',function(){last.pan=this.value;setTimeout(patch,0)})}if(sun&&!sun.dataset.p){sun.dataset.p='1';sun.addEventListener('change',function(){last.sun=this.value;setTimeout(patch,0)})}"
          if old not in s:
              raise SystemExit('Target text not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix sunroof selection persistence' || exit 0
          git push

      - name: Remove patch workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-sunroof-selection.yml
          git add .github/workflows/fix-sunroof-selection.yml
          git commit -m 'Remove one-time sunroof patch workflow' || exit 0
          git push
