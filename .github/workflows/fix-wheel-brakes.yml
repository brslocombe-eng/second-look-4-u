name: Add visible brake disc check
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add brake disc check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='SL4U_WHEEL_BRAKES_V1'
          if marker not in s:
              patch='''<script>/* SL4U_WHEEL_BRAKES_V1 */(function(){var f=document.getElementById('appframe');function go(){try{var d=f&&f.contentDocument,w=f&&f.contentWindow;if(!d||!w||!Array.isArray(w.S))return;var sec=w.S.find(function(x){return x.name==='3. Wheels & tyres';});if(!sec)return;if(!sec.items.some(function(x){return x[0]==='brakediscs'})){sec.items.splice(1,0,['brakediscs','Brake discs — visible condition','If you can see the brake discs through the wheels, visually check them for excessive wear, heavy rust or obvious damage. You will not normally be able to assess the brake pads from outside. Do not diagnose faults.']);w.render()}}catch(e){}}f.addEventListener('load',go);setInterval(go,500)}())</script>'''
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-wheel-brakes.yml
          git commit -m 'Add visible brake disc condition check' || exit 0
          git rm .github/workflows/fix-wheel-brakes.yml
          git commit -m 'Remove one-time brake check patch workflow'
          git push
