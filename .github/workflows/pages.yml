name: Deploy Second Look 4 U

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old = "document.getElementById('next').onclick=()=>{if(sec<sections.length-1){sec++;render()}else{screen='result';render()}}"
          new = "document.getElementById('next').onclick=()=>{if(sec<sections.length-1){sec++;render();requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}))}else{screen='result';render()}}"
          if old not in html:
              raise SystemExit('Expected Next-section handler was not found; deployment stopped safely.')
          index.write_text(html.replace(old, new, 1))

          sw = Path('sw.js')
          worker = sw.read_text()
          if 'second-look-4-u-v7' not in worker:
              raise SystemExit('Expected service-worker cache version was not found; deployment stopped safely.')
          sw.write_text(worker.replace('second-look-4-u-v7', 'second-look-4-u-v8', 1))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
