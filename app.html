<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111418"><meta name="apple-mobile-web-app-capable" content="yes"><title>Second Look 4 U</title><style>:root{--bg:#111418;--card:#1b2026;--line:#303740;--txt:#f4f5f6;--muted:#9ca5b0;--gold:#e6a23c;--green:#38a169;--amber:#e0a12b;--red:#dc4c3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;min-height:100vh;padding-bottom:100px}.top{position:sticky;top:0;z-index:5;background:#111418;border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:center}.brand{font-size:20px;font-weight:800}.brand b{color:var(--gold)}.step{margin-left:auto;color:var(--muted);font-size:12px}.main{padding:22px 18px}h1{font-size:36px;line-height:1.05;margin:0 0 10px}h2{font-size:25px;margin:0 0 8px}h3{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 10px}.sub{color:var(--muted);line-height:1.5}.card,.check{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:6px}.field select,.note{width:100%;background:#15191e;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:13px}.btn{width:100%;border:0;border-radius:13px;padding:16px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#20170b}.secondary{background:#252b32;color:var(--txt);border:1px solid var(--line)}.btn:disabled{opacity:.45}.back{background:none;border:0;color:var(--muted);font-weight:800;padding:0 0 14px}.launch{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 22px}.launch-inner{max-width:440px;width:100%}.mark{width:88px;height:88px;border-radius:26px;margin:0 auto 24px;background:linear-gradient(145deg,#252b32,#15191e);border:1px solid #3b444e;display:grid;place-items:center;position:relative}.mark span{font-size:58px;font-weight:950}.mark b{position:absolute;right:15px;bottom:10px;color:var(--gold);font-size:24px}.kicker{color:var(--gold);font-weight:900;letter-spacing:.15em;text-transform:uppercase;font-size:12px}.launch h1{font-size:43px}.launch h1 b{color:var(--gold)}.launch p{color:var(--muted);font-size:17px;line-height:1.45;margin:0 auto 28px}.warning{border:1px solid var(--red);background:#2a1b18;border-radius:12px;padding:13px;margin:12px 0;line-height:1.45}.warning strong{display:block;color:var(--red);margin-bottom:4px}.progress{height:7px;background:#272d34;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:var(--gold)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{padding:11px 5px;border-radius:10px;border:1px solid var(--line);background:#15191e;color:var(--txt);font-weight:900}.sel.green{background:var(--green);border-color:var(--green)}.sel.amber{background:var(--amber);border-color:var(--amber);color:#17120a}.sel.red{background:var(--red);border-color:var(--red)}.sel.na{background:#59616b}.note-row{display:flex;gap:8px;margin-top:9px}.note{display:block;min-height:60px;flex:1;resize:vertical}.mic{width:54px}.complete{border:1px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:16px}.complete strong{display:block;color:var(--gold);letter-spacing:.08em}.complete span{color:var(--muted);font-size:13px}.footer{position:fixed;bottom:0;left:0;right:0;background:#111418;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:10}.hidden{display:none}.small{font-size:12px;color:var(--muted)}@media(max-width:420px){.launch h1{font-size:37px}.launch{padding:35px 18px}}</style></head><body><div class="wrap"><div class="top" id="top"><div class="brand">Second Look <b>4 U</b></div><div class="step" id="step"></div></div><main class="main" id="app"></main></div><div class="footer hidden" id="footer"><button class="btn primary" id="next"></button></div><script>
const V={hatch5:'5-door hatchback',hatch3:'3-door hatchback',saloon:'4-door saloon / boot',estate:'Estate',sportHard:'2-door sports car — hardtop',sportCanvas:'2-door sports car — canvas convertible'};const convertible=k=>k==='sportCanvas';let screen='launch',vehicle={type:'',trans:'',cold:'',pan:false,sun:false},section=0,answers={};
const S=[
{name:'1. General walk-around',items:[['overall','Overall condition','Walk around the whole vehicle first. Get a feel for the overall condition and note anything that immediately jumps out at you.'],['firstfinding','Anything worth recording?','If you spot damage or anything that concerns you, record it now. You are not expected to diagnose it.']]},
{name:"2. Bodywork — driver's side",items:[['dfw','Driver front wing','Inspect the panel closely for dents, scratches, paint damage or anything unusual.'],['dfd','Driver front door','Inspect the panel, handles, trims and shut lines.'],['drd','Driver rear door','If fitted, inspect the panel, handles, trims and shut lines.'],['drq','Driver rear quarter','Inspect the quarter panel carefully.'],['dsill','Driver side sill','Stand back and inspect the sill for damage, dents or corrosion.'],['roofd','Roof — driver side','While you are on this side, stand back and inspect the roof.']]},
{name:'2. Bodywork — rear',items:[['rear','Rear bumper','Inspect for scratches, dents, cracks, poor repairs or other damage.'],['boot','Boot / tailgate','Inspect the panel, hinges, seal and operation.']]},
{name:"2. Bodywork — passenger side",items:[['prq','Passenger rear quarter','Inspect the quarter panel carefully.'],['psill','Passenger side sill','Stand back and inspect the sill for damage, dents or corrosion.'],['prd','Passenger rear door','If fitted, inspect the panel, handles, trims and shut lines.'],['pfd','Passenger front door','Inspect the panel, handles, trims and shut lines.'],['pfw','Passenger front wing','Inspect the panel closely.'],['roofp','Roof — passenger side','While you are on this side, stand back and inspect the roof.']]},
{name:'2. Bodywork — front end',items:[['front','Front bumper','Inspect for scratches, dents, cracks, poor repairs or other damage.'],['lightsfront','Front lights — physical condition','From outside, inspect the light units for cracks, damage, loose fittings or condensation. Do not get into the car to test them yet.'],['glass','Windscreen','Look for chips, cracks or significant damage.'],['mirrors','Door mirrors','Check the housing and glass for cracks, damage or looseness.']]},
{name:'3. Wheels & tyres',items:[['tyrematch','Do all four tyres match?','Check the make and type fitted to each wheel.'],['tyres','Tyre condition','Look for damage, uneven wear and general condition. Check tread depth if you know how.'],['rearLights','Rear lights — physical condition','Inspect the rear light units from outside for cracks, damage, loose fittings or condensation.']]},
{name:'4. Under the bonnet & cold start',items:[['dry','Engine bay / obvious leaks','Look for obvious leaks, staining, damaged components or anything out of place. You do not need to diagnose it.'],['oil','Oil level / condition','Check only if safe and you are comfortable doing so.'],['coolant','Coolant level','Check only when safe. Never open a hot cooling system.'],['coldstart','Cold start','Start the vehicle from cold and listen carefully for abnormal noises, rough starting or anything unusual.']]},
{name:'5. Inside the car',items:[['windows','Windows & switches','Operate the driver window fully down and back up. Then work your way around the interior: touch, feel and operate the remaining window switches, buttons, controls and fittings you find. Check that they work and are not loose, damaged or broken. If unsure what a control does, ask the seller.'],['seats','Seats & trim','Touch and feel the seats and trim. Check condition, adjustment and that controls operate normally.'],['visors','Sun visors & vanity mirrors','Check the sun visors, vanity mirrors and illumination if fitted.'],['climate','Heating & air conditioning','Check the system gets hot and cold, airflow directions work and air conditioning gets cold if fitted.'],['locks','Locks & mirrors','Check central locking and mirror controls operate normally.'],['wipers','Wipers & washers','Operate them and check normal operation.'],['infotainment','Infotainment / Bluetooth / CarPlay','Check the main functions and connect a phone where appropriate.'],['lightsinside','Interior lights & other controls','Work around the interior and operate the switches, buttons and controls you can see.'],['warning','Warning lights','With the engine running, allow the normal self-check to finish. Note unexplained warning lights.']]},
{name:'5. Boot / luggage compartment',items:[['parcel','Parcel shelf — if the vehicle should have one','Check that the parcel shelf is present, fitted and in reasonable condition.'],['spare','Spare wheel & tools — if fitted','Check that the spare wheel and associated tools are present where applicable.'],['repair','Puncture repair / inflation kit — if fitted','Check that the supplied repair or inflation kit is present.'],['locking','Locking wheel-nut key','Check the locking wheel-nut key is present and, if locking wheel nuts are fitted, confirm that the key matches the vehicle.']]},
{name:'6. Test drive',items:[['gear','Transmission','You selected '+''+' at the start. Drive accordingly and check that the transmission operates normally.'],['clutch','Clutch & gears — manual','If manual, check clutch take-up and gear selection are smooth.'],['auto','Automatic gearbox','If automatic, check Drive and Reverse engage promptly and smoothly.'],['steer','Steering','Check steering feel, stability, pulling and vibration.'],['brake','Brakes','Check braking is smooth and stable with no abnormal vibration.'],['accel','Acceleration','Check acceleration feels normal for the vehicle.'],['noise','No abnormal noises or vibration','Listen carefully while driving. You do not need to diagnose the cause.'],['feel','Car feels right to you','If the car does not feel right, record it.'],['functions','Cruise control / other driving controls — if fitted','If safe and fitted, check the important driving controls operate normally.']]},
{name:'6. Exhaust — after the drive',items:[['smoke','Exhaust smoke','After a decent drive and once warm, look for persistent or excessive smoke, especially blue smoke, or an unusual strong smell.']]},
{name:'7. Final paperwork',items:[['v5','V5C / paperwork','Check the V5C and available paperwork.'],['vin','VIN / chassis number','Check the VIN at the lower passenger-side corner of the dashboard/windscreen and confirm it matches the V5C.'],['history','Service history','Check service records, books or digital history.'],['challenge','Challenge anything you found','If something concerns you, ask the seller about it before deciding.']]}
];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function step(t){document.getElementById('step').textContent=t}function footer(show){document.getElementById('footer').classList.toggle('hidden',!show)}function save(id,status,note){answers[id]=answers[id]||{};if(status)answers[id].status=status;if(note!==undefined)answers[id].note=note}
function launch(){step('');footer(false);document.getElementById('top').style.display='none';document.getElementById('app').innerHTML='<section class="launch"><div class="launch-inner"><div class="mark"><span>S</span><b>4</b></div><div class="kicker">Challenge the car before you commit</div><h1>Second Look <b>4 U</b></h1><p>A practical second look before you buy. Follow the process, check what you find and make your own decision.</p><button class="btn primary" id="go">Get started</button></div></section>';document.getElementById('go').onclick=()=>{screen='setup';render()}}
function setup(){document.getElementById('top').style.display='flex';step('');footer(false);const roof=convertible(vehicle.type)?'':`<div class="field"><label>Panoramic glass roof fitted?</label><select id="pan"><option value="no">No</option><option value="yes">Yes</option></select></div><div class="field"><label>Tilt & slide sunroof fitted?</label><select id="sun"><option value="no">No</option><option value="yes">Yes</option></select></div>`;document.getElementById('app').innerHTML=`<button class="back" id="home">← Home</button><div class="small">GET READY</div><h1>Do Not Start Engine</h1><p class="sub">Set up the inspection before you start the car.</p><div class="card"><div class="field"><label>Choose your vehicle</label><select id="vt"><option value="">Choose vehicle</option>${Object.entries(V).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div><div class="field"><label>Transmission</label><select id="tr"><option value="">Select transmission</option><option value="manual">Manual</option><option value="automatic">Automatic</option></select></div><div class="field"><label>Is the engine cold?</label><select id="cold"><option value="">Select yes or no</option><option value="yes">Yes</option><option value="no">No</option></select></div>${roof}</div><div id="warn"></div><button class="btn primary" id="start" disabled>Start the check</button>`;const vt=document.getElementById('vt'),tr=document.getElementById('tr'),cold=document.getElementById('cold'),warn=document.getElementById('warn'),start=document.getElementById('start');function refresh(){const valid=vt.value&&tr.value&&cold.value==='yes';start.disabled=!valid;warn.innerHTML=cold.value==='no'?'<div class="warning"><strong>Rebook and check the vehicle when cold</strong>You have missed the opportunity to check the vehicle from cold. Some engine noises, particularly in cold conditions, can disappear once the vehicle is warm.</div>':''}vt.onchange=()=>{vehicle.type=vt.value;render()};tr.onchange=()=>{vehicle.trans=tr.value;refresh()};cold.onchange=()=>{vehicle.cold=cold.value;refresh()};if(document.getElementById('pan'))document.getElementById('pan').onchange=e=>vehicle.pan=e.target.value==='yes';if(document.getElementById('sun'))document.getElementById('sun').onchange=e=>vehicle.sun=e.target.value==='yes';document.getElementById('home').onclick=()=>{screen='launch';render()};start.onclick=()=>{S[7].items[0][2]='You selected '+(vehicle.trans==='manual'?'manual':'automatic')+' transmission. Check the controls and driving behaviour appropriate to that transmission.';section=0;answers={};screen='inspect';render()};refresh()}
function inspect(){document.getElementById('top').style.display='flex';const s=S[section],done=Object.keys(answers).length,total=S.reduce((a,x)=>a+x.items.length,0),checked=Object.values(answers).filter(x=>x.status).length,pct=Math.round(checked/total*100);step((section+1)+' / '+S.length);footer(true);document.getElementById('app').innerHTML=`<button class="back" id="back">← Back</button><div class="small">FOLLOW THE PROCESS</div><h2>${s.name}</h2><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="sub">Touch, feel and operate where appropriate. Don't diagnose faults. If something concerns you, record it and decide what it means to you.</p>${s.items.map(([id,title,desc])=>{const a=answers[id]||{};return `<div class="check" data-id="${id}"><h3>${esc(title)}</h3><p class="sub">${esc(desc)}</p><div class="choices"><button class="choice ${a.status==='green'?'sel green':''}" data-s="green">GOOD</button><button class="choice ${a.status==='amber'?'sel amber':''}" data-s="amber">NEGOTIATE</button><button class="choice ${a.status==='red'?'sel red':''}" data-s="red">CONCERN</button></div><button class="choice ${a.status==='na'?'sel na':''}" data-s="na" style="width:100%;margin-top:7px">NOT CHECKED / UNSURE</button><div class="note-row"><textarea class="note" placeholder="Optional note — type it or use your iPhone keyboard microphone">${esc(a.note||'')}</textarea><button class="choice mic" type="button">🎙</button></div><div class="small voice-status"></div></div>`}).join('')}`;document.querySelectorAll('.check').forEach(c=>{const id=c.dataset.id;c.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{save(id,b.dataset.s);render()});const n=c.querySelector('.note');n.oninput=()=>save(id,null,n.value);c.querySelector('.mic').onclick=()=>{n.focus();c.querySelector('.voice-status').textContent='Use the microphone on the iPhone keyboard to dictate. Tap the keyboard microphone again when finished.'};});document.getElementById('back').onclick=()=>{if(section===0){screen='setup';render()}else{section--;render();scrollTop()}};document.getElementById('next').textContent=section===S.length-1?'Complete inspection →':'Next section →';document.getElementById('next').onclick=()=>{if(section<S.length-1){section++;render();scrollTop()}else{screen='result';render()}};}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}function result(){document.getElementById('top').style.display='flex';footer(false);const red=Object.values(answers).filter(x=>x.status==='red').length,amber=Object.values(answers).filter(x=>x.status==='amber').length;const title=red?'WALK AWAY':amber?'NEGOTIATE':'BUY',cl=red?'red':amber?'amber':'green';document.getElementById('app').innerHTML=`<div class="complete"><strong>INSPECTION COMPLETE</strong><span>You have finished the Second Look inspection. Review what you found before deciding.</span></div><div style="text-align:center"><div class="small">YOUR SECOND LOOK RESULT</div><h1 style="color:var(--${cl})">${title}</h1><p class="sub">${red?'You recorded one or more serious concerns.':amber?'You found things worth discussing or reflecting in the price.':'Nothing you recorded is automatically a reason to walk away.'}</p></div><div class="card"><h3>What you found</h3><p class="sub">Red concerns: ${red}<br>Amber items: ${amber}</p></div><button class="btn primary" id="again">Check another car</button>`;document.getElementById('again').onclick=()=>{screen='setup';render()}}
function render(){if(screen==='launch')launch();else if(screen==='setup')setup();else if(screen==='inspect')inspect();else result()}render();
</script></body></html>
