dataset.sl4uActionPatched='1';const note=c.querySelector('.note'),row=c.querySelector('.note-row'),mic=c.querySelector('.mic'),label=c.querySelector('.voice-status');if(row)row.style.display='none';c.querySelectorAll('[data-s]').forEach(b=>{const status=b.dataset.s;b.onclick=function(e){e.preventDefault();e.stopPropagation();if(typeof d.defaultView.save==='function')d.defaultView.save(id,status,'');c.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('sel','green','amber','red','na'));if(status==='green')b.classList.add('sel','green');else if(status==='amber')b.classList.add('sel','amber');else if(status==='red')b.classList.add('sel','red');else b.classList.add('sel','na');if((status==='amber'||status==='red')&&row){row.style.display='flex';if(note){note.focus();note.setSelectionRange(note.value.length,note.value.length)}if(label)label.textContent='Tell us what you want to record, or type it below.'}}});if(mic&&note){mic.onclick=function(e){e.preventDefault();e.stopPropagation();note.focus();if(!('webkitSpeechRecognition'in window)||!window.webkitSpeechRecognition){if(label)label.textContent='Use the microphone on your iPhone keyboard to dictate your note.';return}try{if(speech)speech.abort();const R=window.webkitSpeechRecognition;speech=new R();speech.lang='en-GB';speech.interimResults=true;speech.continuous=false;if(label)label.textContent='Listening… speak your note now.';let base=note.value?note.value+' ':'';let finalText='';speech.onresult=function(ev){let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)finalText+=t;else interim+=t}note.value=base+finalText+interim;note.dispatchEvent(new Event('input',{bubbles:true}))};speech.onend=function(){if(finalText){note.value=base+finalText;note.dispatchEvent(new Event('input',{bubbles:true}))}if(label)label.textContent='Note recorded. Press the microphone again to add more.';speech=null};speech.onerror=function(){if(label)label.textContent='Microphone unavailable. Use the iPhone keyboard microphone instead.';speech=null};speech.start()}catch(e){if(label)label.textContent='Use the microphone on your iPhone keyboard to dictate your note.'}}}})}function patchSticky(d){const h=d.querySelector('h2'),p=d.querySelector('.progress'),top=d.getElementById('top');if(!h||!p||!top)return;const th=top.getBoundingClientRect().height,hh=h.getBoundingClientRect().height;h.style.position='sticky';h.style.top=th+'px';h.style.zIndex='20';h.style.background='#111418';h.style.margin='0';h.style.padding='4px 0 8px';p.style.position='sticky';p.style.top=(th+hh)+'px';p.style.zIndex='19';p.style.background='#111418';p.style.margin='0 -18px 18px';p.style.padding='8px 18px 10px';p.style.height='7px';p.style.boxSizing='content-box'}function patchInputZoom(d){d.querySelectorAll('.note').forEach(n=>{n.style.fontSize='16px';n.style.webkitTextSizeAdjust='100%';n.style.resize='none'})}f.addEventListener('load',function(){patch();try{new MutationObserver(patch).observe(f.contentDocument.body,{childList:true,subtree:true})}catch(e){}})})();</script></body></html>
