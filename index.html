function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setStep(t){document.getElementById('step').textContent=t}function item(id,title,desc,redRule=false){return{id,title,desc,redRule}}
function buildSections(){const v=vehicleTypes[vehicle.type],s=[];s.push({name:'1. General walk-around',items:[item('overall','Overall condition','Walk around the whole vehicle before checking individual items. Get a feel for the condition and look for anything that immediately jumps out at you.'),item('like','Do you like what you see?','This is your first impression. If you simply do not like the look or overall condition of the car, record it.'),item('vin','VIN / chassis number','The VIN is normally on the left-hand side of the dashboard, visible through the windscreen. Check that it matches the VIN on the V5C registration document.',true)]});s.push({name:'2. Bodywork',items:[item('bodydry','Are the body panels dry?','Body panels need to be dry to inspect them properly. Wet panels, frost or ice can hide scratches, dents and other damage. If possible, dry the panels or move the vehicle somewhere dry before checking the bodywork.')]});const panels=['Bonnet','Driver front wing','Driver front door'];if(v.doors===4)panels.push('Driver rear door');panels.push('Driver rear quarter','Driver side sill','Rear bumper','Boot / tailgate','Passenger rear quarter','Passenger side sill');if(v.doors===4)panels.push('Passenger rear door');panels.push('Passenger front door','Passenger front wing','Front bumper');panels.splice(1,0,'Roof');s.push({name:'2. Bodywork',items:panels.map((x,i)=>item('panel'+i,x,'Look closely at the panel for dents, scratches, paint damage or other obvious damage. Do not overthink it — record what you can see.'))});s.push({name:'2. Bodywork — lights, glass & mirrors',items:[item('frontlights','Front lights','Check for obvious cracks, damage or anything that looks out of place.'),item('rearlights','Rear lights','Check for obvious cracks, damage or anything that looks out of place.'),item('windscreen','Windscreen','Look for chips, cracks or significant damage.'),item('mirrors','Door mirrors','Check the housing is intact and the mirror glass is not cracked, loose or obviously damaged.')]});s.push({name:'3. Wheels & tyres',items:[item('tyresmatch','Do all four tyres match?','Check the make and type of tyre fitted to each wheel. If all four do not match, this can be an amber item to consider or negotiate.'),item('tyrescondition','Tyre condition','Look for obvious damage, uneven wear and general condition. If you know how, check tread depth too.'),item('brakes','Brakes — where visible','Only check what you can safely see. Look for obvious heavy corrosion or damage.')]});s.push({name:'4. Under the bonnet & cold start',items:[item('leaks','Obvious leaks or staining','Look for anything obvious. You do not need to diagnose what it is.'),item('oil','Oil level / condition','Only check this if you are comfortable doing so and the vehicle provides a safe way to check it.'),item('coolant','Coolant level / condition','Only check this when safe to do so. Never open a hot cooling system.'),item('underbonnet','Anything obviously damaged or out of place','Look for anything that immediately concerns you.'),item('coldstart','Cold start','If possible, start the car from cold and note how it starts.'),item('enginecold','Engine sounds normal from cold','Listen for severe or abnormal engine noise. You do not need to diagnose the cause.',true)]});s.push({name:'5. Inside the car',items:[item('heatac','Heating & air conditioning','With the engine running, check the temperature control gets hot and cold. If air conditioning is fitted, switch it on at its coldest setting and make sure the air gets cold. Check the main heater functions operate normally.'),item('windows','Electric windows / window controls','Operate the windows and make sure they work normally.'),item('locks','Central locking','Check the vehicle locks and unlocks normally.'),item('keys','Keys / remote controls','If two keys are supplied, check both remotes lock and unlock the vehicle. If only one key is supplied, record it as something to consider when negotiating.'),item('wipers','Wipers & washers','Operate them and make sure they work normally.'),item('lightsinside','Interior controls & lights','Check the main switches and controls operate normally.'),item('horn','Horn','Press the horn and make sure it works.'),item('infotainment','Infotainment / Bluetooth','Check the main infotainment functions. Test Bluetooth connectivity if fitted.'),item('carplay','Apple CarPlay / Android Auto — if fitted','If fitted, connect a phone and check that it works.'),item('parking','Parking sensors / reversing camera — if fitted','If fitted, check that they operate normally.'),item('othercontrols','Other switches / controls','Operate any important equipment fitted to the car and check that it works.'),item('cluster','Instrument cluster warning lights','With the engine running, wait for the normal warning-light self-check to finish. There should not be unexplained red or amber warning lights remaining illuminated.'),item('checkengine','Check engine light — is it on?','Look for the engine-shaped warning symbol after the engine has started. If it remains illuminated, treat this as a red flag. You do not need to diagnose the cause.',true)]});if(v.estate)s.push({name:'5. Estate-specific check',items:[item('tailgate','Electric / powered tailgate — if fitted','Operate the tailgate using the available controls/key and make sure it opens, closes and reaches the correct position.')]});if(vehicle.panoramic)s.push({name:'5. Panoramic roof',items:[item('panoglassin','Panoramic glass — from inside','Look up at the glass and check for obvious cracks or damage.'),item('panoglassout','Panoramic glass — from outside','Inspect the glass from outside as you would when checking the roof.'),item('panoblind','Panoramic roof blind','Operate the blind and make sure it opens and closes smoothly and completely.')]});if(vehicle.sunroof)s.push({name:'5. Sunroof',items:[item('sunroof','Tilt & slide sunroof','Operate the tilt and slide functions fully. Check that it opens, closes and tilts smoothly without sticking or making unusual noises.')]});if(v.convertible)s.push({name:'5. Convertible roof',items:[item('convroof','Convertible roof operation','Operate the roof fully open and fully closed. Make sure it operates smoothly and reaches the correct locked position.'),item('canvas','Canvas roof condition','Check the roof material for obvious rips, tears or excessive wear.')]});s.push({name:'6. Test drive',items:[item('transmission','Manual or automatic?','Select the type of transmission fitted. This question only changes the checks that follow.'),item('clutch','Clutch & gears — manual','Check the clutch engages smoothly and the gears select normally.'),item('autoDrive','Automatic gearbox — Drive','Select Drive. It should engage promptly and smoothly, without a significant delay, clunking or harsh engagement.'),item('autoReverse','Automatic gearbox — Reverse','Select Reverse. It should engage promptly and smoothly, without a significant delay, clunking or harsh engagement.'),item('gearchanges','Gear changes feel smooth','While driving, the transmission should change gear normally for the type of vehicle.'),item('steering','Steering feels normal','Pay attention to the steering feel and any obvious pulling or vibration.'),item('braking','Brakes feel normal','Check the car brakes normally and feels stable. There should be no vibration or shaking through the steering wheel when braking.'),item('accel','Acceleration feels normal','Check that the car accelerates normally for you.'),item('cruise','Cruise control / adaptive cruise — if fitted','If fitted and safe to do so, test the cruise control on the road. Make sure it sets, maintains the selected speed and cancels normally. If the vehicle has adaptive/radar cruise, check that the system appears to operate normally and that no warning message or fault appears.'),item('noise','No abnormal noises or vibration','Listen for anything clearly abnormal while driving.',true),item('drivefeel','Car feels generally right to you','You do not need to know the cause of a problem. If the car does not feel right, record it.',true),item('likeride','Do you like the way this car drives?','There does not need to be a mechanical fault. If you do not like the way it drives, that is a valid reason not to buy it.'),item('extended','Extended road test — if possible','If the road, traffic and legal speed limits allow, use a longer stretch of road where you can safely check the car at normal higher road speeds. Pay attention to any shaking, vibration or instability.')]});s.push({name:'6. Exhaust — after the drive',items:[item('smoke','Exhaust smoke','In cold or damp weather, some white vapour/condensation from the exhaust is normal, especially when the engine is cold. After a decent drive and once the engine is warm, look for persistent or excessive smoke, particularly blue smoke, or an unusual/strong smell.',true)]});s.push({name:'7. Final Second Look',items:[item('v5c','V5C / paperwork','Check the V5C is available and the VIN matches the vehicle.'),item('servicehistory','Service history','Check any service history, service book or digital record that is available.'),item('invoices','Invoices / receipts','Ask to see relevant invoices or receipts if available.'),item('paperworkmatch','Does the paperwork support what you have been told?','Consider whether the history and paperwork fit with the seller’s description of the vehicle.'),item('challenge','Have you challenged anything you found?','If you found something you are not happy with, ask the seller about it before making your decision.')]});return s}
function launch(){setStep('');document.getElementById('footer').classList.add('hidden');document.getElementById('app').innerHTML=`<section class="launch"><div class="launch-inner"><div class="app-mark"><span class="mark-s">S</span><span class="mark-four">4</span></div><p class="launch-kicker">Challenge the car before you commit</p><h1 class="launch-title">Second Look <b>4 U</b></h1><p class="launch-sub">A simple walk-around guide for ordinary buyers. Check the things that are easy to miss, record what you find, and make your own decision.</p><button class="btn primary" id="getStarted">Get started</button><div class="launch-foot">A practical second look before you buy.</div></div></section>`;document.getElementById('getStarted').onclick=()=>{screen='start';render()}}
function start(){setStep('');document.getElementById('footer').classList.add('hidden');document.getElementById('app').innerHTML=`<div class="start-intro"><button class="back" id="homeBack">← Home</button><div class="small">GET READY</div><h1>Choose your vehicle</h1></div><div class="card start-card"><h3>Vehicle</h3><div class="select-wrap"><select id="vehicleType"><option value="">Choose vehicle</option>${Object.entries(vehicleTypes).map(([k,v])=>`<option value="${k}" ${vehicle.type===k?'selected':''}>${v.name}</option>`).join('')}</select></div></div><div class="card start-card"><div class="field"><label>Does it have a panoramic glass roof?</label><select id="pan"><option value="no">No</option><option value="yes">Yes</option></select></div><div class="field"><label>Does it have a tilt & slide sunroof?</label><select id="sun"><option value="no">No</option><option value="yes">Yes</option></select></div></div><div class="card knowledge start-card"><h3>Keep it simple</h3><p>Look, touch and operate what you can. You are not expected to diagnose faults. If something concerns you, record it and decide what it means to you.</p></div><button class="btn primary start-button" id="startBtn" ${vehicle.type?'':'disabled'}>Start the check</button>`;document.getElementById('homeBack').onclick=()=>{screen='launch';render()};document.getElementById('vehicleType').onchange=e=>{vehicle.type=e.target.value;render()};document.getElementById('pan').value=vehicle.panoramic?'yes':'no';document.getElementById('sun').value=vehicle.sunroof?'yes':'no';document.getElementById('pan').onchange=e=>vehicle.panoramic=e.target.value==='yes';document.getElementById('sun').onchange=e=>vehicle.sunroof=e.target.value==='yes';document.getElementById('startBtn').onclick=()=>{vehicle.panoramic=document.getElementById('pan').value==='yes';vehicle.sunroof=document.getElementById('sun').value==='yes';sections=buildSections();results=[];sec=0;screen='inspect';render()}}
function inspect(){const s=sections[sec];setStep(`${sec+1} of ${sections.length}`);const done=results.filter(r=>r.status).length,total=sections.reduce((a,x)=>a+x.items.length,0),pct=Math.round(done/total*100);document.getElementById('app').innerHTML=`<button class="back" id="back">‹ Back</button><div class="small">WALK-AROUND</div><div class="sectionhead"><h2>${s.name}</h2><span class="pill">${pct}% checked</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="sub">Look, touch or operate it where appropriate. Don't diagnose faults. <b>Green</b> = happy, <b>Amber</b> = discuss/negotiate, <b>Red</b> = serious concern. If you're unsure, use Not checked / unsure.</p>${s.items.map(x=>{const r=results.find(z=>z.id===x.id)||{};const isTrans=x.id==='transmission';return `<div class="check" data-check-id="${x.id}"><h4>${x.id==='checkengine'?'<span class="engine-symbol">▰</span>':''}${x.title}</h4><p>${x.desc}</p>${isTrans?`<select class="trans-select" data-transmission="1"><option value="">Select transmission</option><option value="manual" ${r.note==='manual'?'selected':''}>Manual</option><option value="automatic" ${r.note==='automatic'?'selected':''}>Automatic</option></select>`:''}<div class="choices"><button class="choice green ${r.status==='green'?'sel':''}" data-id="${x.id}" data-status="green">GREEN</button><button class="choice amber ${r.status==='amber'?'sel':''}" data-id="${x.id}" data-status="amber">AMBER</button><button class="choice red ${r.status==='red'?'sel':''}" data-id="${x.id}" data-status="red">RED</button></div><button class="choice na ${r.status==='na'?'sel':''}" style="width:100%;margin-top:7px" data-id="${x.id}" data-status="na">NOT CHECKED / UNSURE</button><div class="note-row"><textarea class="note ${r.note?'show':''}" data-note="${x.id}" placeholder="Optional note — type it or use the microphone"></textarea><button type="button" class="choice voice" data-voice="${x.id}" aria-label="Add a voice note">🎙️</button></div><div class="voice-status" data-voice-status="${x.id}"></div></div>`}).join('')}`;document.getElementById('back').onclick=()=>{if(sec===0){screen='start';render()}else{sec--;render()}};document.querySelectorAll('.choice[data-status]').forEach(b=>b.onclick=()=>{let r=results.find(z=>z.id===b.dataset.id);if(!r){r={id:b.dataset.id};results.push(r)}r.status=b.dataset.status;render()});document.querySelectorAll('.note').forEach(t=>t.oninput=()=>{let r=results.find(z=>z.id===t.dataset.note);if(!r){r={id:t.dataset.note};results.push(r)}r.note=t.value});setupVoiceNotes();document.querySelectorAll('[data-transmission]').forEach(sel=>sel.onchange=()=>{let r=results.find(z=>z.id==='transmission');if(!r){r={id:'transmission'};results.push(r)}r.note=sel.value;render()});const trans=(results.find(z=>z.id==='transmission')||{}).note;document.querySelectorAll('[data-check-id="clutch"]').forEach(e=>e.style.display=trans==='automatic'?'none':(trans==='manual'?'block':'none'));document.querySelectorAll('[data-check-id="autoDrive"],[data-check-id="autoReverse"]').forEach(e=>e.style.display=trans==='manual'?'none':(trans==='automatic'?'block':'none'));document.getElementById('next').textContent=sec===sections.length-1?'See my result':'Next section';document.getElementById('next').onclick=()=>{if(sec<sections.length-1){sec++;render()}else{screen='result';render()}}}
function setupVoiceNotes(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);document.querySelectorAll('[data-voice]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.voice,note=document.querySelector(`[data-note="${id}"]`),status=document.querySelector(`[data-voice-status="${id}"]`);note.classList.add('show');if(isiOS){status.textContent='Use the microphone on your iPhone keyboard to dictate your note.';note.focus();return}if(!SR){status.textContent='Voice input is unavailable here. Use the microphone on your keyboard.';note.focus();return}let r=results.find(z=>z.id===id);if(!r){r={id};results.push(r)}const rec=new SR();rec.lang='en-GB';rec.interimResults=false;rec.continuous=false;let finished=false;const finish=()=>{if(finished)return;finished=true;btn.classList.remove('listening')};btn.classList.add('listening');status.textContent='Listening…';rec.onresult=e=>{const spoken=e.results[0][0].transcript.trim(),old=note.value.trim();r.note=old?old+' '+spoken:spoken;note.value=r.note;status.textContent='Voice note added.'};rec.onerror=e=>{status.textContent=e.error==='not-allowed'?'Microphone access was blocked.':'Voice input could not be used. Use the keyboard microphone instead.';finish()};rec.onend=()=>{finish();if(status.textContent==='Listening…')status.textContent='Voice input ended.'};try{rec.start()}catch(e){finish();status.textContent='Voice input could not be started. Use the keyboard microphone instead.'}})}
function result(){setStep('Result');const red=results.filter(r=>r.status==='red'),amber=results.filter(r=>r.status==='amber');let status='green',title='BUY',intro='Nothing you recorded is a reason to walk away.';if(red.length){status='red';title='WALK AWAY';intro='You recorded one or more red items. The app is highlighting them so you can decide whether they are serious enough to stop the purchase.'}else if(amber.length){status='amber';title='NEGOTIATE';intro='You found some things worth discussing or reflecting in the price. Amber does not automatically mean the car is a bad buy.'}const names=id=>{for(const s of sections){const x=s.items.find(i=>i.id===id);if(x)return x.title}return id};document.getElementById('app').innerHTML=`<div class="result"><div class="small">YOUR SECOND LOOK RESULT</div><div class="traffic ${status}">${title}</div><p class="sub">${intro}</p></div><div class="resultbox"><h3 style="margin-top:0">What you found</h3>${red.length?`<div class="reason"><span class="dot redbg"></span><b>Red items</b><div class="small">${red.map(x=>esc(names(x.id))).join(' · ')}</div></div>`:''}${amber.length?`<div class="reason"><span class="dot amberbg"></span><b>Amber items</b><div class="small">${amber.map(x=>esc(names(x.id))).join(' · ')}</div></div>`:''}<div class="reason"><span class="dot greenbg"></span><b>Remember</b><div class="small">Bodywork damage does not automatically mean walk away. If you are happy to live with cosmetic damage, you can still choose to buy — but negotiate if appropriate.</div></div></div><div class="card"><h3 style="margin-top:0">Your decision still matters</h3><p class="sub">Second Look 4 U is a guide, not a mechanic. Serious engine noise, a persistent engine warning light, abnormal smoke, abnormal driving noise or a car that does not drive properly can be strong reasons to walk away. You make the final decision.</p></div><button class="btn primary" onclick="screen='start';render()">Check another car</button><div class="card"><h3 style="margin-top:0">Your final decision</h3><p class="sub">The traffic-light result is a guide. You decide what happens next.</p><div class="decision-grid"><button class="decision green" data-decision="green">BUY — I'm happy with the car</button><button class="decision amber" data-decision="amber">NEGOTIATE — I want to discuss the issues</button><button class="decision red" data-decision="red">WALK AWAY — I'm not happy to proceed</button></div></div>`;document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-decision]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')})}
function render(){document.getElementById('footer').classList.toggle('hidden',screen==='launch'||screen==='start'||screen==='result');if(screen==='launch')launch();else if(screen==='start')start();else if(screen==='inspect')inspect();else result()}render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
